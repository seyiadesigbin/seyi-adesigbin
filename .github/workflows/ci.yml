# The site has no package.json, tests or build step (plain HTML, CSS and JS, no npm).
# The checks below are the ones CLAUDE.md lists under "How to check work" that can run unattended.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every script in next/js
        run: |
          for f in next/js/*.js; do
            echo "node --check $f"
            node --check "$f"
          done
      - name: Syntax-check the holding page script
        run: node --check holding/holding.js
      - name: Check that local files referenced by holding/index.html exist
        run: |
          missing=0
          for ref in $(grep -oE '(src|href)="[^"#?]+"' holding/index.html | sed -E 's/^[a-z]+="//; s/"$//' | grep -vE '^(https?:|mailto:|tel:|data:)'); do
            if [ ! -e "holding/$ref" ]; then echo "missing: holding/$ref"; missing=1; fi
          done
          exit $missing
      - name: Check that local files referenced by next/index.html exist
        run: |
          missing=0
          for ref in $(grep -oE '(src|href)="[^"#?]+"' next/index.html | sed -E 's/^[a-z]+="//; s/"$//' | grep -vE '^(https?:|mailto:|tel:|data:)'); do
            if [ ! -e "next/$ref" ]; then echo "missing: next/$ref"; missing=1; fi
          done
          exit $missing
